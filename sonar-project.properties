sonar.projectKey=react-portail-affiliation
sonar.projectName=react-portail-affiliation (portail front)
sonar.projectVersion=2.0.4

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# tests/e2e/** = specs Playwright (autre workflow, e2e-auto-affiliation.yml),
# pas du code source applicatif a analyser ici.
sonar.exclusions=tests/e2e/**,node_modules/**,dist/**,coverage/**,src/main.tsx,src/vite-env.d.ts

# Genere par npm test / npm run test:coverage (vite.config.ts::test.coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# quartiersMaroc.ts : table de donnees statiques (quartiers/codes postaux, source
# Barid Al-Maghrib) ou chaque entree partage exactement la meme forme structurelle
# ({ quartier: "...", codePostal: "..." }) sur ~3400 lignes. Le detecteur de
# duplication (CPD) confondait cette repetition structurelle avec du code copie-colle,
# alors que le contenu (Casablanca vs Rabat vs Marrakech vs Tanger) est entierement
# distinct — vrai faux positif sur un fichier de donnees, pas de la logique.
sonar.cpd.exclusions=src/core/quartiersMaroc.ts

sonar.sourceEncoding=UTF-8
